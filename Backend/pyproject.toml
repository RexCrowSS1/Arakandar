[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bandar-pasar-backend"
dynamic = ["version"]
description = "Backend API for Bandar Pasar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "supabase>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
inference = [
    "transformers>=4.45,<5",
    "torch>=2.4",
    "accelerate>=1.0",
]
dev = [
    "anyio>=4.8",
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
